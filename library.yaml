# bibi-team — Skill-Manifest (Plugin-System, DESIGN §3.3)
#
# Modell: Vendoring — Skills sind committed (.claude/skills/), nicht gitignored.
# Die-library ist NUR Werkzeug für den Maintainer (initialer Install + Upgrades).
# Andere Entwickler: git clone → Skills sofort da, kein the-library nötig.
#
# Naming (Option A): Engine-Quellordner sind gruppiert (skills/case-*, bibi-*),
# der Katalog-`name:` ist bare → installiert als .claude/skills/<name>/ → der
# Slash-Befehl ist bare (/open, /save, /state …). Siehe DESIGN §3.6.
#
# Aktuell installiert von: plan-net-journey/bibi@7774b35 (dev) — +at/run/job, +job start (Scheduler-Abschluss)
# Upgrade: /library sync im Team-Repo → git diff prüfen → commit + push
#
# Workflow für Maintainer:
#   Install:  /library use <name>    (einmalig oder nach Hinzufügen)
#   Upgrade:  /library sync          (alle installierten Skills aktualisieren)
#   Prüfen:   git diff .claude/skills/
#   Committen: git add .claude/skills/ && git commit -m "upgrade: bibi skills <version>"

default_dirs:
  skills:
    - default: .claude/skills/
    - global: ~/.claude/skills/
  agents:
    - default: .claude/agents/
    - global: ~/.claude/agents/
  prompts:
    - default: .claude/commands/
    - global: ~/.claude/commands/

library:
  skills:
    - name: open
      description: Case öffnen oder reaktivieren (Substring-Match)
      source: https://github.com/plan-net-journey/bibi/blob/dev/skills/case-open/SKILL.md
    - name: save
      description: Status committen und pushen
      source: https://github.com/plan-net-journey/bibi/blob/dev/skills/case-save/SKILL.md
      requires: [skill:sync]
    - name: close
      description: Case pausieren
      source: https://github.com/plan-net-journey/bibi/blob/dev/skills/case-close/SKILL.md
      requires: [skill:save]
    - name: done
      description: Case abschliessen (final)
      source: https://github.com/plan-net-journey/bibi/blob/dev/skills/case-done/SKILL.md
      requires: [skill:save]
    - name: delete
      description: Case unwiderruflich löschen
      source: https://github.com/plan-net-journey/bibi/blob/dev/skills/case-delete/SKILL.md
    - name: protocol
      description: Per-Turn-Logging ein-/ausschalten
      source: https://github.com/plan-net-journey/bibi/blob/dev/skills/case-protocol/SKILL.md
    - name: sync
      description: Repo manuell synchronisieren oder auto_sync konfigurieren
      source: https://github.com/plan-net-journey/bibi/blob/dev/skills/bibi-sync/SKILL.md
    - name: state
      description: Aktuellen bibi-Zustand anzeigen (Read-only)
      source: https://github.com/plan-net-journey/bibi/blob/dev/skills/bibi-state/SKILL.md
    - name: at
      description: One-shot-Schedule anlegen (läuft einmal zur gegebenen Zeit)
      source: https://github.com/plan-net-journey/bibi/blob/dev/skills/bibi-at/SKILL.md
    - name: run
      description: Job sofort lokal ausführen (umgeht den Scheduler, rein lokal)
      source: https://github.com/plan-net-journey/bibi/blob/dev/skills/bibi-run/SKILL.md
    - name: job
      description: Scheduler-Jobs listen/inspizieren/killen/neustarten (via Daemon)
      source: https://github.com/plan-net-journey/bibi/blob/dev/skills/bibi-job/SKILL.md
    - name: soul
      description: Aktive Persona wechseln/anzeigen (.claude/souls/*.SOUL.md, team-eigen)
      source: https://github.com/plan-net-journey/bibi/blob/dev/skills/bibi-soul/SKILL.md
    - name: job-create
      description: Interaktiver Wizard, um eine neue Schedule anzulegen
      source: https://github.com/plan-net-journey/bibi/blob/dev/skills/bibi-job-create/SKILL.md
    - name: job-doctor
      description: Konsistenz-Diagnose ueber bestehende bibi-ctrl-Befehle (rescan/mergeback/doctor/job list)
      source: https://github.com/plan-net-journey/bibi/blob/dev/skills/bibi-job-doctor/SKILL.md
    # Gitea-URL, anders als die 14 Eintraege darueber. Hintergrund, damit das
    # nicht wie ein Fluechtigkeitsfehler aussieht: die alten github.com-URLs
    # sind eine BEWUSSTE Zurueckstellung (INSTALL.md, "Track C") — the-library
    # parst bislang nur GitHub-Quell-URLs, `/library use|sync` funktioniert
    # gegen Gitea also ohnehin nicht, weshalb die Umstellung als folgenlos
    # zurueckgestellt wurde. bibi-notes hat seine eigene library.yaml
    # inzwischen trotzdem vollstaendig auf Gitea gezogen (2026-07-24); dieser
    # neue Eintrag folgt dem, weil die Repos dort liegen und GitHub im Projekt
    # tabu ist. Die uebrigen 14 anzugleichen bleibt kosmetisch, solange
    # Track C offen ist — ein Punkt fuer den Blueprint-Abgleich, kein
    # Nebeneffekt dieses Commits.
    - name: bibi-setup
      description: Interviewgefuehrtes Node-Onboarding (init --non-interactive, Daemon-Start, Browser-Oeffnen)
      source: http://sarasate.tail9f9173.ts.net:3000/m.rau/bibi/src/branch/dev/skills/bibi-setup/SKILL.md
