# bibi-team — Skill-Manifest (Plugin-System, DESIGN §3.3)
#
# Modell: Vendoring — Skills sind committed (.claude/skills/), nicht gitignored.
# Die-library ist NUR Werkzeug für den Maintainer (initialer Install + Upgrades).
# Andere Entwickler: git clone → Skills sofort da, kein the-library nötig.
#
# Naming (Option A): Engine-Quellordner sind gruppiert (skills/case-*, bibi-*),
# der Katalog-`name:` ist bare → installiert als .claude/skills/<name>/ → der
# Slash-Befehl ist bare (/open, /save, /state …). Siehe DESIGN §3.6.
#
# Aktuell installiert von: plan-net-journey/bibi@9060bad (dev) — bibi-setup: vier Knotenarten (#180), job-create: attempts-Fix (#70)
#
# URL-Form ungeprueft (2026-08-06): the-library parst GitHub-Quellen, die
# genaue erwartete Form (blob/ vs. raw.githubusercontent.com) ist hier nicht
# verifiziert worden — beim ersten `/library sync` gegenpruefen.
# Upgrade: /library sync im Team-Repo → git diff prüfen → commit + push
#
# Workflow für Maintainer:
#   Install:  /library use <name>    (einmalig oder nach Hinzufügen)
#   Upgrade:  /library sync          (alle installierten Skills aktualisieren)
#   Prüfen:   git diff .claude/skills/
#   Committen: git add .claude/skills/ && git commit -m "upgrade: bibi skills <version>"
#
# Beim Prüfen: die Quelle gegen die Engine datieren, nicht gegen sich selbst.
# "Byte-identisch zur kanonischen Quelle" ist nur so viel wert, wie die Quelle
# aktuell ist — hinkt sie einer Verhaltensänderung hinterher, zieht ein Sync
# den veralteten Stand hierher und macht ihn zum gültigen. Bei einem Skill, der
# sich auffällig ändert oder auffällig *nicht* ändert:
#   git -C <bibi> log -1 --date=short --format=%ad -- skills/<quelle>/SKILL.md
# gegen das Datum der letzten Verhaltensänderung am zugehörigen Kommando halten.
# Weicht das ab, erst die Quelle reparieren, dann vendoren.
#
# Präzedenzfall: PLAN-38 stellte /run am 27.07.2026 auf in-place um, ließ aber
# skills/bibi-run/SKILL.md auf dem Stand vom 24.07. Der Backport 4932b6b holte
# damit die abgeschaffte Worktree-Isolation in diesen Blueprint zurück
# (repariert: bibi f500543, bibi-team 56372fe). Dieselbe Regel steht als
# Gegenstück im README der Engine — dort als Pflicht des Autors, den
# SKILL.md-Text im selben Commit mitzuziehen.
#
# QUELLE IST GITHUB, und das ist seit dem 2026-08-06 keine Ausnahme mehr,
# sondern der Normalfall: `bibi` ist öffentlich, die `source:`-URLs unten zeigen
# dorthin, und `/library use|sync` funktioniert damit ohne Credentials.
#
# Hier stand bis dahin das Gegenteil — „GitHub ist im Projekt tabu", dazu
# Gitea-Pfade der Form /src/branch/dev/skills/…. Beides war an die Zeit
# gebunden, in der die Engine auf einer Tailnet-internen Gitea lag. Ein Satz,
# der eine überholte Lage als Regel formuliert, ist teurer als gar keiner: er
# hält jemanden davon ab, das Richtige zu tun.
#
# Track C: `/library use|sync` parst bislang nur GitHub-Quell-URLs und
# funktioniert gegen Gitea ohnehin nicht. Die URLs unten sind damit reine
# Dokumentation, kein funktionierender Bezugsweg — Skills werden zurzeit von
# Hand vendort. Solange das so ist, ist ihre Form folgenlos; sie stimmt
# trotzdem, damit sie nicht später als Flüchtigkeitsfehler gelesen wird.

default_dirs:
  skills:
    - default: .claude/skills/
    - global: ~/.claude/skills/
  agents:
    - default: .claude/agents/
    - global: ~/.claude/agents/
  prompts:
    - default: .claude/commands/
    - global: ~/.claude/commands/

library:
  skills:
    - name: open
      description: Case öffnen oder reaktivieren (Substring-Match)
      source: https://github.com/plan-net-journey/bibi/blob/master/skills/case-open/SKILL.md
    - name: save
      description: Status committen und pushen
      source: https://github.com/plan-net-journey/bibi/blob/master/skills/case-save/SKILL.md
      requires: [skill:sync]
    - name: close
      description: Case pausieren
      source: https://github.com/plan-net-journey/bibi/blob/master/skills/case-close/SKILL.md
      requires: [skill:save]
    - name: done
      description: Case abschliessen (final)
      source: https://github.com/plan-net-journey/bibi/blob/master/skills/case-done/SKILL.md
      requires: [skill:save]
    - name: delete
      description: Case unwiderruflich löschen
      source: https://github.com/plan-net-journey/bibi/blob/master/skills/case-delete/SKILL.md
    - name: protocol
      description: Per-Turn-Logging ein-/ausschalten
      source: https://github.com/plan-net-journey/bibi/blob/master/skills/case-protocol/SKILL.md
    - name: sync
      description: Repo manuell synchronisieren oder auto_sync konfigurieren
      source: https://github.com/plan-net-journey/bibi/blob/master/skills/bibi-sync/SKILL.md
    - name: state
      description: Aktuellen bibi-Zustand anzeigen (Read-only)
      source: https://github.com/plan-net-journey/bibi/blob/master/skills/bibi-state/SKILL.md
    - name: at
      description: One-shot-Schedule anlegen (läuft einmal zur gegebenen Zeit)
      source: https://github.com/plan-net-journey/bibi/blob/master/skills/bibi-at/SKILL.md
    - name: run
      description: Job sofort lokal ausführen (umgeht den Scheduler, rein lokal)
      source: https://github.com/plan-net-journey/bibi/blob/master/skills/bibi-run/SKILL.md
    - name: job
      description: Scheduler-Jobs listen/inspizieren/killen/neustarten (via Daemon)
      source: https://github.com/plan-net-journey/bibi/blob/master/skills/bibi-job/SKILL.md
    - name: soul
      description: Aktive Persona wechseln/anzeigen (.claude/souls/*.SOUL.md, team-eigen)
      source: https://github.com/plan-net-journey/bibi/blob/master/skills/bibi-soul/SKILL.md
    - name: job-create
      description: Interaktiver Wizard, um eine neue Schedule anzulegen
      source: https://github.com/plan-net-journey/bibi/blob/master/skills/bibi-job-create/SKILL.md
    - name: job-doctor
      description: Konsistenz-Diagnose ueber bestehende bibi-ctrl-Befehle (rescan/mergeback/doctor/job list)
      source: https://github.com/plan-net-journey/bibi/blob/master/skills/bibi-job-doctor/SKILL.md
    - name: bibi-setup
      description: Interviewgefuehrtes Node-Onboarding (init --non-interactive, Daemon-Start, Browser-Oeffnen)
      source: https://github.com/plan-net-journey/bibi/blob/master/skills/bibi-setup/SKILL.md
