[project]
name = "bibi-team"
version = "0.0.0"
description = "Team-Repo der bibi-Engine — deklariert bibi als Abhängigkeit"
requires-python = ">=3.11"
dependencies = [
    # Engine als Abhängigkeit (DESIGN §3.2). Privates Repo — Installation
    # benötigt GitHub-Auth (gh/credential-helper). Für lokale Entwicklung
    # stattdessen: uv pip install -e ../bibi  (siehe INSTALL.md).
    "bibi @ git+https://github.com/plan-net-journey/bibi.git@trunk",
]
